<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: { "primary": "#ec5b13", "background-light": "#ffffff", "background-dark": "#221610" },
    fontFamily: { "display": ["Noto Sans JP", "Public Sans", "sans-serif"] },
    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
  }}
}
</script>
<style>
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
body { min-height: max(884px, 100dvh); }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

<!-- Header -->
<header class="sticky top-0 z-50 flex items-center bg-white/80 dark:bg-background-dark/80 backdrop-blur-md px-4 py-3 border-b border-slate-100 dark:border-slate-800">
  <div class="flex w-10 items-center justify-start">
    <button onclick="history.back()" class="flex items-center justify-center p-1 text-slate-600 dark:text-slate-400">
      <span class="material-symbols-outlined">arrow_back_ios</span>
    </button>
  </div>
  <h1 id="md-title" class="flex-1 text-center text-base font-bold leading-tight tracking-tight truncate px-2"></h1>
  <div class="flex w-10 items-center justify-end">
    <button onclick="location.href='/search'" class="flex items-center justify-center p-1 text-slate-600 dark:text-slate-400">
      <span class="material-symbols-outlined">search</span>
    </button>
  </div>
</header>

<main class="flex-1">
  <div class="flex flex-col gap-3 py-3">

    <!-- 1. 並び替えセグメント -->
    <div class="px-4">
      <div class="flex h-11 items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 p-1">
        <label class="flex h-full grow cursor-pointer items-center justify-center rounded-lg px-2 text-sm font-bold transition-all has-[:checked]:bg-white has-[:checked]:text-primary dark:has-[:checked]:bg-slate-700 shadow-sm has-[:checked]:shadow-none">
          <span>新着順</span>
          <input checked class="hidden" name="sort-seg" type="radio" value="new"/>
        </label>
        <label class="flex h-full grow cursor-pointer items-center justify-center rounded-lg px-2 text-sm font-bold text-slate-500 transition-all has-[:checked]:bg-white has-[:checked]:text-primary dark:has-[:checked]:bg-slate-700 shadow-sm has-[:checked]:shadow-none">
          <span>人気順</span>
          <input class="hidden" name="sort-seg" type="radio" value="popular"/>
        </label>
      </div>
    </div>

    <!-- 2. フィルターバー -->
    <div class="flex items-center gap-2 overflow-x-auto px-4 no-scrollbar">
      <button id="btn-best" class="flex h-9 shrink-0 items-center justify-center gap-1 rounded-full border border-slate-200 dark:border-slate-700 px-3 py-1">
        <span class="text-xs font-medium">BEST/総集編</span>
        <span id="best-icon" class="material-symbols-outlined text-[18px] text-primary">toggle_on</span>
      </button>
      <button id="btn-vr" class="flex h-9 shrink-0 items-center justify-center gap-1 rounded-full border border-slate-200 dark:border-slate-700 px-3 py-1">
        <span class="text-xs font-medium">VR作品</span>
        <span id="vr-icon" class="material-symbols-outlined text-[18px] text-slate-400">toggle_off</span>
      </button>
      <button id="btn-cal" class="flex h-9 shrink-0 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 px-3">
        <span class="material-symbols-outlined text-[18px]">calendar_today</span>
      </button>
    </div>

    <!-- 3. カレンダーパネル（折りたたみ） -->
    <div id="cal-panel" class="hidden px-4">
      <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-4 space-y-3">
        <div class="flex items-center gap-3">
          <div class="flex-1">
            <label class="text-[11px] text-slate-500 mb-1 block">発売日 From</label>
            <input id="sf-from" type="date" class="w-full text-xs border border-slate-200 dark:border-slate-600 rounded-lg px-2 py-1.5 bg-white dark:bg-slate-700"/>
          </div>
          <div class="flex-1">
            <label class="text-[11px] text-slate-500 mb-1 block">発売日 To</label>
            <input id="sf-to" type="date" class="w-full text-xs border border-slate-200 dark:border-slate-600 rounded-lg px-2 py-1.5 bg-white dark:bg-slate-700"/>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="setQuickDate('month')" class="flex-1 py-1.5 text-[11px] font-bold bg-slate-100 dark:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-primary hover:text-white transition-colors">直近1ヶ月</button>
          <button onclick="setQuickDate('year')"  class="flex-1 py-1.5 text-[11px] font-bold bg-slate-100 dark:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-primary hover:text-white transition-colors">直近1年</button>
          <button onclick="clearDate()"           class="flex-1 py-1.5 text-[11px] font-bold bg-slate-100 dark:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">クリア</button>
        </div>
      </div>
    </div>

    <!-- 4. 作品グリッド -->
    <div id="products-grid" class="grid grid-cols-3 gap-x-2 gap-y-4 px-4 pb-24">
      <!-- skeletons -->
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-2/3"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-2/3"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-2/3"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-2/3"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-2/3"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-2/3"></div></div>
    </div>

  </div>
</main>

<!-- Bottom nav placeholder (replaced by injectLayout) -->
<nav class="fixed bottom-0 left-0 right-0 z-50 flex border-t border-slate-100 dark:border-slate-800 bg-white/95 dark:bg-background-dark/95 backdrop-blur-md px-2 pb-6 pt-2"></nav>

<script>
(function(){
  var makerName = decodeURIComponent(location.pathname.split('/maker/')[1] || '');
  var grid = document.getElementById('products-grid');
  var sort = 'new', excludeBest = true, excludeVR = false, fromDate = '', toDate = '';
  var page = 0, loading = false, hasMore = true, LIMIT = 30;
  var abortCtrl = null;

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function poster(url){
    if(!url)return'';
    if(url.includes('pb_e_'))return url.replace('pb_e_','pf_e_');
    if(url.includes('/digital/amateur/')&&url.endsWith('jm.jpg'))return url.replace('jm.jpg','jp-001.jpg');
    return url;
  }

  // タイトル
  var titleEl = document.getElementById('md-title');
  if (titleEl) titleEl.textContent = makerName;
  document.title = makerName + ' - AVランキング';

  // BEST/総集編トグル
  var btnBest = document.getElementById('btn-best');
  var bestIcon = document.getElementById('best-icon');
  if (btnBest) btnBest.addEventListener('click', function(){
    excludeBest = !excludeBest;
    if (bestIcon){ bestIcon.textContent = excludeBest ? 'toggle_on' : 'toggle_off'; bestIcon.className = 'material-symbols-outlined text-[18px] ' + (excludeBest ? 'text-primary' : 'text-slate-400'); }
    load(true);
  });

  // VRトグル
  var btnVR = document.getElementById('btn-vr');
  var vrIcon = document.getElementById('vr-icon');
  if (btnVR) btnVR.addEventListener('click', function(){
    excludeVR = !excludeVR;
    if (vrIcon){ vrIcon.textContent = excludeVR ? 'toggle_on' : 'toggle_off'; vrIcon.className = 'material-symbols-outlined text-[18px] ' + (excludeVR ? 'text-primary' : 'text-slate-400'); }
    load(true);
  });

  // カレンダーパネル
  var btnCal = document.getElementById('btn-cal');
  var calPanel = document.getElementById('cal-panel');
  if (btnCal && calPanel) btnCal.addEventListener('click', function(){ calPanel.classList.toggle('hidden'); });
  var fromInput = document.getElementById('sf-from');
  var toInput   = document.getElementById('sf-to');
  if (fromInput) fromInput.addEventListener('change', function(){ fromDate = fromInput.value; load(true); });
  if (toInput)   toInput.addEventListener('change',   function(){ toDate   = toInput.value;   load(true); });

  window.setQuickDate = function(period) {
    var now = new Date();
    var from = new Date(now);
    if (period === 'month') from.setDate(now.getDate() - 30);
    else from.setFullYear(now.getFullYear() - 1);
    fromDate = from.toISOString().slice(0,10);
    toDate   = now.toISOString().slice(0,10);
    if (fromInput) fromInput.value = fromDate;
    if (toInput)   toInput.value   = toDate;
    load(true);
  };
  window.clearDate = function() {
    fromDate = toDate = '';
    if (fromInput) fromInput.value = '';
    if (toInput)   toInput.value   = '';
    load(true);
  };

  // 並び替えセグメント
  document.querySelectorAll('input[name="sort-seg"]').forEach(function(r){
    r.addEventListener('change', function(){
      sort = r.value === 'popular' ? 'wish_count' : 'new';
      load(true);
    });
  });

  // カードHTML（products.htmlと同スタイル）
  function cardHtml(p) {
    var img = poster(p.main_image_url || '');
    var noAct = !(p.actresses && p.actresses.trim());
    return '<div class="flex flex-col gap-1" style="cursor:pointer" onclick="location.href=\'/product/\'+encodeURIComponent(\''+esc(p.product_id)+'\')">'
      +'<div class="relative aspect-[3/4] w-full overflow-hidden rounded-lg bg-slate-200 dark:bg-slate-700">'
      +(img ? '<img class="w-full h-full object-cover object-right block" src="'+esc(img)+'" alt="" loading="lazy" decoding="async"/>' : '')
      +(p.discount_pct > 0 ? '<span class="absolute top-1 left-1 bg-rose-600 text-white text-[9px] font-black px-1 py-0.5 rounded leading-none">'+p.discount_pct+'%<br>OFF</span>' : '')
      +'<div class="absolute bottom-1 right-1 flex gap-1">'
      +(noAct ? '<button data-pid="'+esc(p.product_id)+'" class="h-5 w-5 flex items-center justify-center rounded-full bg-black/30 backdrop-blur-sm text-white" onclick="event.preventDefault();event.stopPropagation();location.href=\'/cast/register/\'+encodeURIComponent(this.dataset.pid)"><span class="material-symbols-outlined text-[12px]">add</span></button>' : '')
      +'<button data-like-pid="'+esc(p.product_id)+'" class="h-5 w-5 flex items-center justify-center rounded-full bg-black/30 backdrop-blur-sm text-white" onclick="event.preventDefault();event.stopPropagation();toggleLike(this,this.dataset.likePid)"><span class="material-symbols-outlined text-[12px]">favorite</span></button>'
      +'</div></div>'
      +'<p class="line-clamp-2 text-[11px] font-bold leading-tight">'+esc(p.title||'')+'</p>'
      +(p.actresses ? '<p class="text-[10px] text-slate-400 truncate">'+esc(p.actresses.split(',')[0].trim())+'</p>' : '')
      +'</div>';
  }

  function skeletonHtml(n) {
    var s = '';
    for(var i=0;i<n;i++) s += '<div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-2/3"></div></div>';
    return s;
  }

  function load(reset) {
    if (loading && !reset) return;
    if (reset) { page = 0; hasMore = true; }
    if (!hasMore) return;
    if (abortCtrl) abortCtrl.abort();
    abortCtrl = new AbortController();
    loading = true;
    if (reset && grid) grid.innerHTML = skeletonHtml(LIMIT);
    var offset = page * LIMIT;
    var url = '/api/products?maker='+encodeURIComponent(makerName)+'&exactMaker=1&sort='+sort+'&limit='+(LIMIT+1)+'&offset='+offset;
    if (excludeBest) url += '&excludeBest=1';
    if (excludeVR)   url += '&excludeGenres=VR';
    if (fromDate)    url += '&fromDate='+fromDate;
    if (toDate)      url += '&toDate='+toDate;
    fetch(url, { signal: abortCtrl.signal })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (!grid || abortCtrl.signal.aborted) return;
        loading = false;
        var arr = Array.isArray(data) ? data : [];
        hasMore = arr.length > LIMIT;
        if (hasMore) arr = arr.slice(0, LIMIT);
        var html = arr.map(cardHtml).join('');
        if (reset) grid.innerHTML = html || '<p class="col-span-3 text-center text-xs text-slate-400 py-8">作品が見つかりませんでした</p>';
        else grid.insertAdjacentHTML('beforeend', html);
        if (window.restoreLikes) window.restoreLikes();
        page++;
      })
      .catch(function(e){ if (e.name !== 'AbortError') { loading = false; if(grid && reset) grid.innerHTML = '<p class="col-span-3 text-center text-xs text-slate-400 py-8">エラーが発生しました</p>'; } });
  }

  // 無限スクロール
  window.addEventListener('scroll', function(){
    if (loading || !hasMore) return;
    if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 400) load(false);
  }, {passive:true});

  load(true);
})();
</script>
</div>
</body>
</html>
