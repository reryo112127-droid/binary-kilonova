<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: { "primary": "#ec5b13", "background-light": "#ffffff", "background-dark": "#221610" },
    fontFamily: { "display": ["Noto Sans JP", "Public Sans", "sans-serif"] },
    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
  }}
}
</script>
<style>
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
body { min-height: max(884px, 100dvh); }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

<!-- Header -->
<header class="sticky top-0 z-50 flex items-center bg-white/90 dark:bg-background-dark/90 backdrop-blur-md px-4 py-3 border-b border-slate-100 dark:border-slate-800">
  <div class="flex w-10 items-center justify-start">
    <button onclick="history.back()" class="flex items-center justify-center p-1 text-slate-600 dark:text-slate-400">
      <span class="material-symbols-outlined">arrow_back_ios</span>
    </button>
  </div>
  <h1 id="md-title" class="flex-1 text-center text-base font-bold leading-tight tracking-tight truncate px-2"></h1>
  <div class="flex w-10 items-center justify-end">
    <button onclick="location.href='/search'" class="flex items-center justify-center p-1 text-slate-600 dark:text-slate-400">
      <span class="material-symbols-outlined">search</span>
    </button>
  </div>
</header>

<main class="flex-1">
  <div class="flex flex-col gap-3 py-3">

    <!-- 並び替え: 新着/人気 -->
    <div class="px-4">
      <div class="flex h-11 items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 p-1">
        <button id="btn-sort-new" onclick="setSort('new')"
          class="flex h-full grow cursor-pointer items-center justify-center rounded-lg px-2 text-sm font-bold bg-white dark:bg-slate-700 text-primary shadow-sm transition-all">
          新着順
        </button>
        <button id="btn-sort-popular" onclick="setSort('wish_count')"
          class="flex h-full grow cursor-pointer items-center justify-center rounded-lg px-2 text-sm font-bold text-slate-500 transition-all">
          人気順
        </button>
      </div>
    </div>

    <!-- フィルターバー -->
    <div class="flex items-center gap-2 overflow-x-auto px-4 no-scrollbar">
      <button id="btn-fanza" onclick="toggleSource('fanza')"
        class="flex h-9 shrink-0 items-center justify-center rounded-full border border-slate-200 dark:border-slate-700 px-3 py-1">
        <span class="text-xs font-medium">FANZA</span>
      </button>
      <button id="btn-mgs" onclick="toggleSource('mgs')"
        class="flex h-9 shrink-0 items-center justify-center rounded-full border border-slate-200 dark:border-slate-700 px-3 py-1">
        <span class="text-xs font-medium">MGS動画</span>
      </button>
      <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 shrink-0"></div>
      <button id="btn-best" onclick="toggleBest()"
        class="flex h-9 shrink-0 items-center justify-center gap-1 rounded-full border border-slate-200 dark:border-slate-700 px-3 py-1">
        <span class="text-xs font-medium">BEST/総集編</span>
        <span id="best-icon" class="material-symbols-outlined text-[18px] text-primary">toggle_on</span>
      </button>
    </div>

    <!-- 作品グリッド -->
    <div id="md-grid" class="grid grid-cols-3 gap-x-2 gap-y-4 px-4 pb-24">
      <!-- skeletons -->
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div></div>
      <div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div></div>
    </div>

  </div>
</main>

<!-- Bottom nav placeholder (replaced by injectLayout) -->
<nav class="fixed bottom-0 left-0 right-0 z-50 flex border-t border-slate-100 dark:border-slate-800 bg-white/95 dark:bg-background-dark/95 backdrop-blur-md px-2 pb-6 pt-2"></nav>

<script>
(function(){
  var makerName = decodeURIComponent(location.pathname.split('/maker/')[1] || '');
  var sort = 'new';
  var source = '';
  var excludeBest = true;
  var page = 0;
  var loading = false;
  var hasMore = true;
  var LIMIT = 30;
  var abortCtrl = null;

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function poster(url){
    if(!url)return'';
    if(url.includes('pb_e_'))return url.replace('pb_e_','pf_e_');
    if(url.includes('/digital/amateur/')&&url.endsWith('jm.jpg'))return url.replace('jm.jpg','jp-001.jpg');
    return url;
  }

  // タイトル設定
  var titleEl = document.getElementById('md-title');
  if (titleEl) titleEl.textContent = makerName;
  document.title = makerName + ' - AVランキング';

  // 並び替え
  window.setSort = function(s) {
    sort = s;
    var btnNew = document.getElementById('btn-sort-new');
    var btnPop = document.getElementById('btn-sort-popular');
    var activeClass = 'flex h-full grow cursor-pointer items-center justify-center rounded-lg px-2 text-sm font-bold bg-white dark:bg-slate-700 text-primary shadow-sm transition-all';
    var inactiveClass = 'flex h-full grow cursor-pointer items-center justify-center rounded-lg px-2 text-sm font-bold text-slate-500 transition-all';
    if (btnNew) btnNew.className = s === 'new' ? activeClass : inactiveClass;
    if (btnPop) btnPop.className = s === 'wish_count' ? activeClass : inactiveClass;
    load(true);
  };

  // ソースフィルター
  var sourceActiveClass = 'flex h-9 shrink-0 items-center justify-center rounded-full border px-3 py-1 bg-primary border-primary text-white';
  var sourceInactiveClass = 'flex h-9 shrink-0 items-center justify-center rounded-full border border-slate-200 dark:border-slate-700 px-3 py-1';
  window.toggleSource = function(s) {
    source = source === s ? '' : s;
    var fb = document.getElementById('btn-fanza');
    var mb = document.getElementById('btn-mgs');
    if (fb) fb.className = source === 'fanza' ? sourceActiveClass : sourceInactiveClass;
    if (mb) mb.className = source === 'mgs' ? sourceActiveClass : sourceInactiveClass;
    load(true);
  };

  // BEST/総集編トグル
  window.toggleBest = function() {
    excludeBest = !excludeBest;
    var icon = document.getElementById('best-icon');
    if (icon) {
      icon.textContent = excludeBest ? 'toggle_on' : 'toggle_off';
      icon.className = 'material-symbols-outlined text-[18px] ' + (excludeBest ? 'text-primary' : 'text-slate-400');
    }
    load(true);
  };

  // カードHTML
  function cardHtml(p) {
    var img = poster(p.main_image_url || '');
    var noAct = !(p.actresses && p.actresses.trim());
    return '<a href="/product/'+encodeURIComponent(p.product_id)+'" class="flex flex-col gap-1 block">'
      +'<div class="relative w-full aspect-[3/4] overflow-hidden rounded-md bg-slate-100 dark:bg-slate-800">'
      +(img ? '<img class="w-full h-full object-cover object-right block" src="'+esc(img)+'" loading="lazy" decoding="async"/>' : '')
      +(p.discount_pct > 0 ? '<span class="absolute top-1 left-1 bg-rose-600 text-white text-[9px] font-black px-1 py-0.5 rounded leading-none">'+p.discount_pct+'%<br>OFF</span>' : '')
      +'<div class="absolute bottom-1 right-1 flex gap-1">'
      +(noAct ? '<button data-pid="'+esc(p.product_id)+'" class="h-5 w-5 flex items-center justify-center rounded-full bg-black/30 backdrop-blur-sm text-white" onclick="event.preventDefault();event.stopPropagation();location.href=\'/cast/register/\'+encodeURIComponent(this.dataset.pid)"><span class="material-symbols-outlined text-[12px]">add</span></button>' : '')
      +'<button data-like-pid="'+esc(p.product_id)+'" class="h-5 w-5 flex items-center justify-center rounded-full bg-black/30 backdrop-blur-sm text-white" onclick="event.preventDefault();event.stopPropagation();toggleLike(this,this.dataset.likePid)"><span class="material-symbols-outlined text-[12px]">favorite</span></button>'
      +'</div></div>'
      +'<p class="line-clamp-2 text-[10px] font-bold leading-tight">'+esc(p.title||'')+'</p>'
      +(p.actresses ? '<p class="text-[9px] text-primary truncate">'+esc(p.actresses.split(',')[0].trim())+'</p>' : '')
      +'</a>';
  }

  function skeletonHtml(n) {
    var s = '';
    for (var i=0;i<n;i++) s += '<div class="flex flex-col gap-1"><div class="aspect-[3/4] rounded-md bg-slate-200 dark:bg-slate-700 animate-pulse"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded animate-pulse w-full"></div></div>';
    return s;
  }

  function load(reset) {
    if (loading && !reset) return;
    if (reset) { page = 0; hasMore = true; }
    if (!hasMore) return;
    if (abortCtrl) abortCtrl.abort();
    abortCtrl = new AbortController();
    loading = true;
    var grid = document.getElementById('md-grid');
    if (reset && grid) grid.innerHTML = skeletonHtml(LIMIT);
    var offset = page * LIMIT;
    var url = '/api/products?maker='+encodeURIComponent(makerName)+'&exactMaker=1&sort='+sort+'&limit='+(LIMIT+1)+'&offset='+offset;
    if (source) url += '&source='+source;
    if (excludeBest) url += '&excludeBest=1';
    fetch(url, { signal: abortCtrl.signal })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (!grid || abortCtrl.signal.aborted) return;
        loading = false;
        var arr = Array.isArray(data) ? data : [];
        hasMore = arr.length > LIMIT;
        if (hasMore) arr = arr.slice(0, LIMIT);
        var html = arr.map(cardHtml).join('');
        if (reset) grid.innerHTML = html || '<p class="col-span-3 text-center text-xs text-slate-400 py-8">作品が見つかりませんでした</p>';
        else grid.insertAdjacentHTML('beforeend', html);
        if (window.restoreLikes) window.restoreLikes();
        page++;
      })
      .catch(function(e){ if (e.name !== 'AbortError') loading = false; });
  }

  // 無限スクロール
  window.addEventListener('scroll', function(){
    if (loading || !hasMore) return;
    if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 400) load(false);
  }, {passive:true});

  load(true);
})();
</script>
</div>
</body>
</html>
