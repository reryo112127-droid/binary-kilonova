<!DOCTYPE html>
<html class="light" lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>セール作品 | AVランキング</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#ec5b13",
        "background-light": "#f8f6f6",
        "background-dark": "#221610",
      },
      fontFamily: { "display": ["Public Sans", "sans-serif"] },
      borderRadius: {"DEFAULT": "0.25rem","lg": "0.5rem","xl": "0.75rem","full": "9999px"},
    },
  },
}
</script>
<style>
body { font-family: 'Public Sans', sans-serif; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.active-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="relative flex min-h-screen flex-col overflow-x-hidden">
<header></header>
<main class="flex-1 pb-28">

<!-- ヒーローバナー -->
<div class="bg-gradient-to-r from-red-600 to-red-500 px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined text-white text-[22px] active-icon">local_offer</span>
    <div>
      <p class="text-white font-black text-base leading-none">セール中</p>
      <p id="hero-sub" class="text-red-100 text-[10px] mt-0.5">FANZA割引作品 最大<span id="max-discount">50</span>% OFF</p>
    </div>
  </div>
  <div class="text-right">
    <p class="text-white font-black text-xl leading-none" id="total-count">-</p>
    <p class="text-red-100 text-[10px]">件</p>
  </div>
</div>

<!-- フィルターバー -->
<div class="flex gap-2 px-4 py-3 overflow-x-auto no-scrollbar items-center">
  <button id="src-fanza" class="flex-none h-8 px-3 rounded-full text-xs font-bold bg-red-500 text-white transition-all">FANZA</button>
  <button id="src-mgs"   class="flex-none h-8 px-3 rounded-full text-xs font-bold bg-white border border-slate-200 text-slate-600 transition-all">MGS</button>
  <div class="w-px bg-slate-200 self-stretch mx-1"></div>
  <button id="sf-best-btn" class="flex h-8 shrink-0 items-center gap-1 rounded-full border border-gray-200 px-3">
    <span class="text-[10px] font-bold text-slate-600">BEST除外</span>
    <span id="sf-best-icon" class="material-symbols-outlined text-[18px] text-gray-300">toggle_off</span>
  </button>
  <button id="sf-vr-btn" class="flex h-8 shrink-0 items-center gap-1 rounded-full border border-gray-200 px-3">
    <span class="text-[10px] font-bold text-slate-600">VR除外</span>
    <span id="sf-vr-icon" class="material-symbols-outlined text-[18px] text-gray-300">toggle_off</span>
  </button>
</div>

<!-- 作品グリッド -->
<div class="grid grid-cols-3 gap-x-2 gap-y-4 px-3" id="sale-grid">
  <div class="flex flex-col gap-1 animate-pulse"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div></div>
  <div class="flex flex-col gap-1 animate-pulse"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div></div>
  <div class="flex flex-col gap-1 animate-pulse"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div></div>
  <div class="flex flex-col gap-1 animate-pulse"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div></div>
  <div class="flex flex-col gap-1 animate-pulse"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div></div>
  <div class="flex flex-col gap-1 animate-pulse"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div></div>
</div>

<!-- もっと見るボタン -->
<div class="flex justify-center py-4">
  <button id="load-more-btn" onclick="fetchMore()" style="display:none"
    class="w-full max-w-xs mx-3 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-600 shadow-sm active:bg-slate-50">
    もっと見る
  </button>
</div>

</main>
<nav class="fixed bottom-0 left-0 right-0 z-50"></nav>
</div>

<script>(function(){
var g = document.getElementById('sale-grid');
if (!g) return;
var LIMIT = 20, fetchOffset = 0, isLoading = false;
var filters = { source: 'fanza', excludeBest: false, excludeVr: false };

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function poster(url) {
  if (!url) return '';
  if (url.includes('pb_e_')) return url.replace('pb_e_','pf_e_');
  if (url.includes('/digital/amateur/') && url.endsWith('jm.jpg')) return url.replace('jm.jpg','jp-001.jpg');
  return url;
}
function setLoadMoreBtn(v) { var b = document.getElementById('load-more-btn'); if (b) b.style.display = v ? 'flex' : 'none'; }

function discountColor(d) {
  if (d >= 50) return 'bg-red-600';
  if (d >= 30) return 'bg-red-500';
  if (d >= 20) return 'bg-orange-500';
  return 'bg-orange-400';
}

function fmtEndDate(s) {
  if (!s) return '';
  var d = new Date(s.replace(' ', 'T'));
  if (isNaN(d)) return '';
  var now = new Date();
  var diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
  var label = (d.getMonth()+1) + '/' + d.getDate() + 'まで';
  if (diff <= 1) return '<span style="color:#dc2626;font-weight:900;font-size:9px;">本日終了</span>';
  if (diff <= 3) return '<span style="color:#dc2626;font-size:9px;font-weight:700;">⏰ ' + label + '</span>';
  return '<span style="color:#6b7280;font-size:9px;">' + label + '</span>';
}

function cardHtml(p) {
  var img = poster(p.main_image_url || '');
  var disc = parseInt(p.discount_pct) || 0;
  var listP = parseInt(p.list_price) || 0;
  var curP = parseInt(p.current_price) || 0;
  var pid = encodeURIComponent(p.product_id || '');
  var endLabel = fmtEndDate(p.sale_end_date || '');
  return '<a href="/product/' + pid + '" class="flex flex-col gap-1 group">'
    + '<div class="relative aspect-[3/4] w-full overflow-hidden rounded-lg bg-slate-200 dark:bg-slate-700">'
    + (img ? '<img class="w-full h-full object-cover object-right block group-hover:scale-105 transition-transform duration-200" src="' + esc(img) + '" loading="lazy"/>' : '')
    + (disc ? '<span class="absolute top-1.5 left-1.5 ' + discountColor(disc) + ' text-white text-[9px] font-black px-1.5 py-0.5 rounded leading-none">' + disc + '%<br>OFF</span>' : '')
    + '<div class="absolute bottom-1.5 right-1.5 flex gap-1">'
    + '<button data-like-pid="'+esc(p.product_id||'')+'" onclick="event.preventDefault();event.stopPropagation();toggleLike(this,this.dataset.likePid)" class="w-6 h-6 flex items-center justify-center bg-white/90 rounded-full shadow text-primary hover:bg-primary hover:text-white transition-colors"><span class="material-symbols-outlined text-[14px]">favorite</span></button>'
    + '</div>'
    + '</div>'
    + (curP ? '<p class="text-[11px] font-black text-red-500 leading-none flex items-baseline gap-1 flex-wrap">¥' + curP.toLocaleString() + '<span class="text-[9px] font-normal text-slate-400 line-through">¥' + (listP||curP).toLocaleString() + '</span>' + (endLabel ? endLabel : '') + '</p>' : '')
    + '<p class="text-[10px] font-bold leading-tight line-clamp-2 text-slate-800 dark:text-slate-100">' + esc(p.title||'') + '</p>'
    + '</a>';
}

function applyFilters(data) {
  return data.filter(function(p) {
    if (filters.excludeVr && p.genres && /\bVR\b|VR専用/i.test(p.genres)) return false;
    return true;
  });
}

function buildUrl(offset) {
  var sort = 'discount';
  var u = '/api/products?sort=' + sort + '&source=' + filters.source + '&limit=' + (LIMIT+1) + '&offset=' + offset;
  if (filters.excludeBest) u += '&excludeBest=1';
  return u;
}

var srcActCls = 'flex-none h-8 px-3 rounded-full text-xs font-bold bg-red-500 text-white transition-all';
var srcInaCls = 'flex-none h-8 px-3 rounded-full text-xs font-bold bg-white border border-slate-200 text-slate-600 transition-all';
var srcFanzaBtn = document.getElementById('src-fanza');
var srcMgsBtn   = document.getElementById('src-mgs');
var bestBtn  = document.getElementById('sf-best-btn');
var bestIcon = document.getElementById('sf-best-icon');
var vrBtn    = document.getElementById('sf-vr-btn');
var vrIcon   = document.getElementById('sf-vr-icon');

function updateSourceBtns() {
  if (srcFanzaBtn) srcFanzaBtn.className = filters.source === 'fanza' ? srcActCls : srcInaCls;
  if (srcMgsBtn)   srcMgsBtn.className   = filters.source === 'mgs'   ? srcActCls : srcInaCls;
  // ヒーローバナーのサブタイトル
  var sub = document.getElementById('hero-sub');
  if (sub) sub.textContent = filters.source === 'mgs' ? 'MGS人気作品' : 'FANZA割引作品 最大' + document.getElementById('max-discount').textContent + '% OFF';
}

if (srcFanzaBtn) srcFanzaBtn.addEventListener('click', function() { filters.source = 'fanza'; updateSourceBtns(); load(); });
if (srcMgsBtn)   srcMgsBtn.addEventListener('click',   function() { filters.source = 'mgs';   updateSourceBtns(); load(); });
if (bestBtn) bestBtn.addEventListener('click', function() {
  filters.excludeBest = !filters.excludeBest;
  if (bestIcon) { bestIcon.textContent = filters.excludeBest ? 'toggle_on' : 'toggle_off'; bestIcon.className = 'material-symbols-outlined text-[18px] ' + (filters.excludeBest ? 'text-primary' : 'text-gray-300'); }
  load();
});
if (vrBtn) vrBtn.addEventListener('click', function() {
  filters.excludeVr = !filters.excludeVr;
  if (vrIcon) { vrIcon.textContent = filters.excludeVr ? 'toggle_on' : 'toggle_off'; vrIcon.className = 'material-symbols-outlined text-[18px] ' + (filters.excludeVr ? 'text-primary' : 'text-gray-300'); }
  load();
});

function load() {
  fetchOffset = 0;
  g.innerHTML = [1,2,3,4,5,6].map(function(){
    return '<div class="flex flex-col gap-1 animate-pulse"><div class="aspect-[3/4] rounded-lg bg-slate-200 dark:bg-slate-700"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-2/3"></div><div class="h-2 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div></div>';
  }).join('');
  setLoadMoreBtn(false);
  fetch(buildUrl(0))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var hasMore = data && data.length > LIMIT;
      if (hasMore) data = data.slice(0, LIMIT);
      data = applyFilters(data || []);
      if (!data.length) {
        g.innerHTML = '<p class="col-span-3 text-center text-slate-400 py-12 text-xs">作品がありません</p>';
        return;
      }
      if (filters.source === 'fanza') {
        var maxD = data.reduce(function(m, p){ return Math.max(m, parseInt(p.discount_pct)||0); }, 0);
        var el = document.getElementById('max-discount');
        if (el && maxD) el.textContent = maxD;
      }
      var cnt = document.getElementById('total-count');
      if (cnt) cnt.textContent = (hasMore ? LIMIT + '+' : data.length);
      g.innerHTML = data.map(cardHtml).join('');
      fetchOffset = LIMIT;
      setLoadMoreBtn(hasMore);
    })
    .catch(function(){ g.innerHTML = '<p class="col-span-3 text-center text-slate-400 py-12 text-xs">読み込みエラー</p>'; });
}

window.fetchMore = function() {
  if (isLoading) return;
  isLoading = true;
  var btn = document.getElementById('load-more-btn');
  if (btn) { btn.textContent = '読み込み中...'; btn.disabled = true; }
  fetch(buildUrl(fetchOffset))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var hasMore = data && data.length > LIMIT;
      if (hasMore) data = data.slice(0, LIMIT);
      data = applyFilters(data || []);
      if (data.length) g.insertAdjacentHTML('beforeend', data.map(cardHtml).join(''));
      fetchOffset += LIMIT;
      setLoadMoreBtn(hasMore);
    })
    .catch(function(){})
    .finally(function(){ isLoading = false; if (btn) { btn.textContent = 'もっと見る'; btn.disabled = false; } });
};
(function(){var s=document.getElementById('load-more-btn');if(!s||!window.IntersectionObserver)return;new IntersectionObserver(function(e){if(e[0].isIntersecting)window.fetchMore&&window.fetchMore();},{rootMargin:'200px'}).observe(s);})();

load();
})();
</script>
</body>
</html>
