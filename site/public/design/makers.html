<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary":"#ec5b13","background-light":"#f8f6f6","background-dark":"#221610"},fontFamily:{display:["Public Sans"]}}}}</script>
<title>メーカー一覧 - AVランキング</title>
<style>
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-white dark:bg-background-dark shadow-xl">

<!-- Header -->
<header class="sticky top-0 z-50 bg-white/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
  <!-- Title row -->
  <div class="flex items-center gap-3 px-4 py-3">
    <button onclick="history.back()" class="flex size-9 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0">
      <span class="material-symbols-outlined text-slate-600 dark:text-slate-300 text-[22px]">arrow_back_ios_new</span>
    </button>
    <h1 class="text-base font-bold flex-1">メーカー一覧</h1>
    <span id="maker-count" class="text-xs text-slate-400 shrink-0"></span>
  </div>
  <!-- Platform tabs (pill style) -->
  <div class="flex gap-2 px-4 pb-3 overflow-x-auto no-scrollbar">
    <button id="ptab-fanza"   onclick="setPlatform('fanza')"   class="shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-primary text-white transition-all">FANZA</button>
    <button id="ptab-mgs"     onclick="setPlatform('mgs')"     class="shrink-0 px-4 py-1.5 rounded-full text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all">MGS動画</button>
  </div>
  <!-- 五十音 index (flex-wrap, all buttons visible) -->
  <div id="kana-index" class="flex flex-wrap gap-1.5 px-4 pb-3"></div>
  <!-- Search -->
  <div class="px-4 pb-3">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[16px]">search</span>
      <input id="maker-search" type="search" placeholder="メーカーを検索..." autocomplete="off"
        class="w-full pl-8 pr-3 py-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-xs outline-none border border-transparent focus:border-primary transition-colors"/>
    </div>
  </div>
</header>

<!-- Content -->
<main class="flex-1 pb-28" id="makers-main"></main>

<!-- Bottom nav (replaced by injectMobileLayout) -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 dark:bg-background-dark/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-4 pb-6 pt-2 flex justify-between items-center z-50"></nav>

<script>
(function(){
  var allMakers = [];
  var platform = 'fanza';
  var activeKana = 'all';

  var KANA_GROUPS = [
    'あ','か','さ','た','な','は','ま','や','ら','わ','漢字','A-Z','#'
  ];
  var KANA_RANGES = {
    'あ':[0x3041,0x304A],'か':[0x304B,0x3054],'さ':[0x3055,0x305E],
    'た':[0x305F,0x3069],'な':[0x306A,0x306E],'は':[0x306F,0x307C],
    'ま':[0x307E,0x3082],'や':[0x3084,0x3088],'ら':[0x3089,0x308D],
    'わ':[0x308F,0x3093],
  };
  var KANJI_BOUNDS = [
    {l:'か',g:'あ'},{l:'さ',g:'か'},{l:'た',g:'さ'},{l:'な',g:'た'},
    {l:'は',g:'な'},{l:'ま',g:'は'},{l:'や',g:'ま'},{l:'ら',g:'や'},{l:'わ',g:'ら'},
  ];

  function toHira(code) {
    if (code >= 0x30A1 && code <= 0x30F6) return code - 0x60;
    return code;
  }

  function getGroup(name) {
    var c0 = name.charAt(0);
    var code = toHira(name.charCodeAt(0));
    for (var k in KANA_RANGES) {
      var r = KANA_RANGES[k];
      if (code >= r[0] && code <= r[1]) return k;
    }
    if ((c0>='A'&&c0<='Z')||(c0>='a'&&c0<='z')) return 'A-Z';
    var cCode = name.charCodeAt(0);
    if ((cCode >= 0x4E00 && cCode <= 0x9FFF) || (cCode >= 0x3400 && cCode <= 0x4DBF)) {
      // 読み仮名が無いため漢字は読み順に分類できない → 専用「漢字」グループにまとめる
      return '漢字';
    }
    return '#';
  }

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function idxBtnCls(active) {
    return 'kana-btn shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold transition-colors '
      + (active ? 'bg-primary text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400');
  }
  function platBtnCls(active) {
    return 'shrink-0 px-4 py-1.5 rounded-full text-xs font-bold transition-all '
      + (active ? 'bg-primary text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300');
  }

  window.setPlatform = function(p) {
    platform = p; activeKana = 'all';
    ['fanza','mgs'].forEach(function(id) {
      var btn = document.getElementById('ptab-' + id);
      if (btn) btn.className = platBtnCls(id === p);
    });
    render();
  };

  window.setKanaBtn = function(k) {
    activeKana = k;
    document.querySelectorAll('.kana-btn').forEach(function(btn) {
      btn.className = idxBtnCls(btn.getAttribute('data-kana') === k);
    });
    render();
  };

  function buildIndex(filtered) {
    var idx = document.getElementById('kana-index');
    if (!idx) return;
    var existing = new Set(filtered.map(function(m){ return getGroup(m.name); }));
    var btns = [{label:'すべて', key:'all'}]
      .concat(KANA_GROUPS.filter(function(g){ return existing.has(g); }).map(function(g){ return {label:g, key:g}; }));
    idx.innerHTML = btns.map(function(b) {
      return '<button class="' + idxBtnCls(activeKana === b.key)
        + '" data-kana="' + b.key + '" onclick="setKanaBtn(\'' + b.key + '\')">' + b.label + '</button>';
    }).join('');
  }

  function makerCard(m) {
    return '<a href="/maker/'+encodeURIComponent(m.name)+'" class="flex items-center gap-2.5 px-3 py-3 bg-white dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800 rounded-xl active:bg-slate-50 dark:active:bg-slate-700 transition-colors">'
      +'<span class="material-symbols-outlined text-primary text-[18px] shrink-0">business</span>'
      +'<div class="flex-1 min-w-0">'
      +'<p class="text-[12px] font-bold leading-tight truncate">'+esc(m.name)+'</p>'
      +'<p class="text-[10px] text-slate-400 mt-0.5">'+Number(m.count).toLocaleString()+'作品</p>'
      +'</div>'
      +'<span class="material-symbols-outlined text-slate-300 text-[16px] shrink-0">chevron_right</span>'
      +'</a>';
  }

  function render() {
    var q = ((document.getElementById('maker-search')||{}).value||'').trim().toLowerCase();

    var filtered = allMakers.filter(function(m) {
      if (platform === 'fanza')   return m.sources && m.sources.includes('fanza');
      if (platform === 'mgs')     return m.sources && m.sources.includes('mgs');
      return true;
    });
    if (q) filtered = filtered.filter(function(m){ return m.name.toLowerCase().includes(q); });

    // 日本語ロケールで全体をソート
    filtered = filtered.slice().sort(function(a, b) { return a.name.localeCompare(b.name, 'ja'); });

    buildIndex(filtered);

    var html = '';
    if (activeKana === 'all' || q) {
      var groups = {};
      filtered.forEach(function(m) { var g = getGroup(m.name); if (!groups[g]) groups[g]=[]; groups[g].push(m); });
      KANA_GROUPS.forEach(function(row) {
        var items = groups[row];
        if (!items || !items.length) return;
        html += '<div class="px-3 pt-4 pb-1"><h2 class="text-sm font-black text-primary border-l-4 border-primary pl-2">'+esc(row)+'</h2></div>'
          +'<div class="px-3 flex flex-col gap-1.5 pb-2">'+items.map(makerCard).join('')+'</div>';
      });
    } else {
      var sel = filtered.filter(function(m){ return getGroup(m.name) === activeKana; });
      html = sel.length ? '<div class="px-3 pt-4 flex flex-col gap-1.5">'+sel.map(makerCard).join('')+'</div>' : '';
    }

    if (!html) html = '<p class="text-center text-sm text-slate-400 py-12">見つかりませんでした</p>';
    document.getElementById('makers-main').innerHTML = html;
    var cntEl = document.getElementById('maker-count');
    if (cntEl) cntEl.textContent = filtered.length + '件';
  }

  fetch('/api/makers')
    .then(function(r){ return r.json(); })
    .then(function(data) {
      allMakers = Array.isArray(data) ? data : [];
      render();
    })
    .catch(function() {
      document.getElementById('makers-main').innerHTML = '<p class="text-center text-sm text-slate-400 py-12">読み込みに失敗しました</p>';
    });

  var si = document.getElementById('maker-search');
  if (si) si.addEventListener('input', function(){ activeKana='all'; render(); });
})();
</script>
</div>
</body>
</html>
