name: AVWiki Scraper

on:
  schedule:
    # D1の日次枠は UTC 0時リセットで、サイトのアクセスにより1〜2時間で枯渇する。
    # 19:00 UTC は枯渇後なのでバックフィルの D1 読み取りが全滅し、
    # 「対象0件のまま82秒で success」を毎日繰り返していた（2026-09-05 確認）。
    - cron: '40 0 * * *'      # 毎日 9:40 JST (= 0:40 UTC / D1枠リセット直後)
    # 週次の全件再スキャンは約5時間・枠を大量に食うので、日次の書き込み系が終わった後に置く
    - cron: '0 2 * * 0'       # 毎週日曜 11:00 JST (= 2:00 UTC) — 全件再スキャン（SNS・改名更新）
  workflow_dispatch:            # 手動実行
    inputs:
      rescan:
        description: '全件再スキャン（SNS・改名を強制更新）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: avwiki-scraper
  cancel-in-progress: false  # 前回が終わるまで待つ

permissions:
  contents: write

jobs:
  scrape:
    name: AVWiki スクレイプ (女優 + 品番)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 再スキャンモードの判定（週次スケジュール or 手動でrescan=true）
      - name: Set rescan flag
        id: mode
        run: |
          # ↑の週次cronと**必ず同じ文字列**にすること（ずれると再スキャンが永久に走らない）
          if [ "${{ github.event.schedule }}" = "0 2 * * 0" ] || [ "${{ github.event.inputs.rescan }}" = "true" ]; then
            echo "rescan=true" >> $GITHUB_OUTPUT
          else
            echo "rescan=false" >> $GITHUB_OUTPUT
          fi

      # 女優プロフィールスクレイプ（10秒間隔、最大3時間 ≒ 1,080ページ/回 → 9,447人を約9日で完走）
      - name: Scrape actress profiles (通常)
        if: steps.mode.outputs.rescan == 'false'
        run: timeout 3h node scripts/scrape_avwiki_full.js --interval 10 || true
        env:
          CI: ''

      # 週次再スキャン: 全女優を再スキャンしてSNS・改名情報を更新
      - name: Scrape actress profiles (再スキャン)
        if: steps.mode.outputs.rescan == 'true'
        run: timeout 3h node scripts/scrape_avwiki_full.js --interval 10 --rescan || true
        env:
          CI: ''

      # 品番→出演者の回収。
      # 旧: scrape_avwiki_products.js --interval 15 で 15,000件の固定URLリストを巡回していたが、
      #     リストは 2026-03-23 で凍結し --fetch-urls もどこからも呼ばれないため、
      #     av-wiki.net の全187,014ページに対し 8% しか触れていなかった(残りは永久に未取得)。
      #     しかも全件完了済みなので、この3時間ステップは毎日「残り0件」で空回りしていた。
      # 新: サイトマップ(188本)から全スラグ集合を作り、**自DBで出演者が空の作品**の品番を
      #     avwikiスラグへ変換して突合し、**存在するページだけ**を取りに行く。
      #     187,014リクエスト → 実測3,166件へ縮小し、取りこぼしなく回収できる。
      - name: Refresh avwiki sitemap slugs (週次)
        if: steps.mode.outputs.rescan == 'true'
        run: node scripts/avwiki_backfill_actresses.js --refresh-sitemap --dry-run || true

      - name: Backfill actresses from avwiki (対象を絞って取得)
        run: timeout 120m node scripts/avwiki_backfill_actresses.js --limit 5000 --interval 1400 || true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_MGS_ID:             ${{ secrets.D1_MGS_ID }}
          D1_FANZA_0_ID:        ${{ secrets.D1_FANZA_0_ID }}
          D1_FANZA_1_ID:        ${{ secrets.D1_FANZA_1_ID }}
      # 女優名検索への反映は D1 トリガ(products_au)が自動同期
      - name: Apply avwiki product map to DB
        run: node scripts/scrape_avwiki_products.js --apply || echo "apply failed (non-fatal)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_MGS_ID:             ${{ secrets.D1_MGS_ID }}
          D1_FANZA_0_ID:        ${{ secrets.D1_FANZA_0_ID }}
          D1_FANZA_1_ID:        ${{ secrets.D1_FANZA_1_ID }}
      # avwiki_full.jsonl → D1 actress_profiles に反映
      # 再スキャン時は --force でSNS・改名を上書き更新
      - name: Build avwiki profiles (D1)
        run: |
          if [ "${{ steps.mode.outputs.rescan }}" = "true" ]; then
            node scripts/build_avwiki_profiles.js --force || echo "build_avwiki_profiles failed (non-fatal)"
          else
            node scripts/build_avwiki_profiles.js || echo "build_avwiki_profiles failed (non-fatal)"
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_FANZA_0_ID:        ${{ secrets.D1_FANZA_0_ID }}
          D1_FANZA_1_ID:        ${{ secrets.D1_FANZA_1_ID }}
      # 進捗ファイルをコミットしてpush（次回の続き再開に使う）
      - name: Commit progress
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/avwiki_full.jsonl \
            data/avwiki_full_progress.json \
            data/avwiki_product_map.jsonl \
            data/avwiki_products_progress.json \
            data/avwiki_url_list.json \
            data/avwiki_product_urls.json \
            data/avwiki_backfill_checked.json \
            || true
          if ! git diff --staged --quiet; then
            if [ "${{ steps.mode.outputs.rescan }}" = "true" ]; then
              git commit -m "avwiki: weekly rescan - SNS/改名情報更新 [skip ci] [vercel skip]"
            else
              git commit -m "avwiki: scraper progress [skip ci] [vercel skip]"
            fi
            git pull --rebase origin main || git rebase --abort || true
            git push || echo "Push failed (non-fatal, will retry next run)"
          fi

      # 静的キャッシュ生成・Cloudflareデプロイは PC(daily_main.bat, MGS取得後 10:30) に集約。
      # ここでは行わない（Turso読み込みの二重消費を避けるため）。
      # AVWIKIで取得した女優情報(Turso反映済み)は、次回のPC日次バッチのcache生成で反映される。
