name: 週次価格更新（直近6年）

on:
  schedule:
    # FANZA は D1 枠リセット直後に動かす（2026-09-10）。旧 14:00 UTC は GitHub の遅延で
    # 17:24 UTC 頃に走り、その時間帯は日次枠が切れていて毎回 22 秒で失敗していた。
    - cron: '30 0 * * 5'   # 金曜 09:30 JST (= 0:30 UTC / D1枠リセット直後) — FANZA
    - cron: '0 6 * * 5'    # 金曜 15:00 JST (= 06:00 UTC) — MGS
  workflow_dispatch:
    inputs:
      target:
        description: '実行対象 (fanza / mgs / both)'
        required: false
        default: 'both'

concurrency:
  group: weekly-price-${{ github.event.schedule || inputs.target || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  #  FANZA: 木曜 23:00 JST に実行
  # ----------------------------------------------------------------
  fanza-price-refresh:
    name: FANZA 価格更新（72ヶ月）
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 最大3時間
    if: >-
      github.event.schedule == '30 0 * * 5' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'fanza' || inputs.target == 'both'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 直近72ヶ月（6年）の価格・セール・評価情報を更新
      # 予約商品取得はスキップ（daily-updateで実施済み）
      # Best版・総集編は評価更新をスキップし価格のみ更新
      # 期間の指定は `--years`。以前は `--months 72` と書いていたが fanza_daily_update.js は
      # --months を解釈しないため、既定の2年＝日次と同じ範囲しか更新していなかった。
      - name: FANZA 価格更新 (直近6年)
        run: node scripts/fanza_daily_update.js --years 6 --no-preorder
        env:
          DMM_API_ID:            ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID:      ${{ secrets.DMM_AFFILIATE_ID }}
          DMM_AFFILIATE_IDS:     ${{ secrets.DMM_AFFILIATE_IDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_FANZA_0_ID:        ${{ secrets.D1_FANZA_0_ID }}
          D1_FANZA_1_ID:        ${{ secrets.D1_FANZA_1_ID }}
  # ----------------------------------------------------------------
  #  MGS: 金曜 15:00 JST に実行（FANZAセール開始翌日）
  # ----------------------------------------------------------------
  mgs-price-refresh:
    name: MGS 価格更新（700ページ）
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 最大2時間

    if: >-
      github.event.schedule == '0 6 * * 5' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'mgs' || inputs.target == 'both'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 直近700ページ（約6年分）の価格・セール情報を更新
      - name: MGS 価格更新 (直近6年)
        run: node scripts/phase3_daily_update.js --pages 700 --no-preorder
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_MGS_ID:             ${{ secrets.D1_MGS_ID }}
