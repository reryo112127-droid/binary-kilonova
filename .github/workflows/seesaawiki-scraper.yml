name: Seesaawiki Scraper

# seesaawiki.jp/av_neme（このAV女優の名前教えてwiki）から女優→FANZA品番のマッピングを収集する。
#
# これまで自動実行の口が一つも無く、2026-05-09 を最後に停止していた:
#   - scripts/seesaawiki_by_actress.js は Turso 廃止後も @libsql/client を require したままで
#     `Cannot find module '@libsql/client'` により **起動すらできなかった**（→ D1 へ移行済み）
#   - 呼び出し元は daily_run.bat / daily_avwiki.bat のみで、どちらも無効化済みタスク。
#     しかも --apply-only（反映のみ）で収集は走らない構成だった
#   - 進捗ファイルの completed（URL→trueの再開マップ）を完走時に boolean で潰しており、
#     再開情報が毎回消えていた（→ finished フラグに分離済み）
#
# avwiki-scraper.yml（19:00 UTC）とは 2時間ずらして commit の衝突を避ける。

on:
  schedule:
    # 21:00 UTC は D1の日次枠が枯渇済みの時間帯（枠は UTC 0時リセット）。
    # 週次の「Apply to D1」がそこで全滅していたのでリセット直後へ移動（2026-09-05）。
    - cron: '0 1 * * *'       # 毎日 10:00 JST (= 1:00 UTC / D1枠リセット直後)。収集→D1反映
  workflow_dispatch:
    inputs:
      apply:
        description: 'D1へ反映する（既定: する）'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

concurrency:
  group: seesaawiki-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    name: Seesaawiki スクレイプ (女優→品番)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set apply flag
        id: mode
        run: |
          # 2026-09-15 の初回反映は読取 4,950万行（枠の990%）になった。原因は FTS 同期トリガが
          # 題名2文字以下の作品で products_fts を全走査していたこと（UPDATE 1件で約13.5万行）。
          # 0012/0013 に *_alt トリガを足して 2026-09-16 に適用し、**1件 71行**まで下がったので再開する
          # （実測: sweet079 rows_read=71 / rows_written=3 / 9.5ms）。
          # 手動実行で apply=false を選んだときだけ止める。
          if [ "${{ github.event.inputs.apply }}" = "false" ]; then
            echo "apply=false" >> $GITHUB_OUTPUT
          else
            echo "apply=true" >> $GITHUB_OUTPUT
          fi

      # サイトマップを毎回取り直し、progress_v2.completed に無いURLだけを続きから取得する。
      # 約9,800ページ。2.5秒間隔なので1回(5時間)あたり約7,000ページ＝2日で一巡する。
      # ジョブ上限は6時間なので、後続の反映・コミットの時間を残して5時間で切る。
      - name: Scrape seesaawiki v2 (続きから)
        run: timeout 5h node scripts/seesaawiki_by_actress.js || true

      # 収集済みマッピング(v2)を D1(FANZA/MGS) へ反映。
      # 採用するのは「出演作品 > FANZA素人 / MGS動画 / 素人・別名名義・名前なし作品」欄だけで、
      # 実在女優(site/data/actress_whitelist.json)に限る。空欄は補完し、既に出演者がいる作品は
      # 元の名義を残したまま末尾に女優名を足す。1件の UPDATE は FTS トリガ込みで約3書込になり、
      # 平常日の書込が既に約6.6万行/日あるので、D1 の書込枠(10万行/日)を守るため1回6,000件まで。
      # 反映済みは次回スキップされる（冪等）ので、残りは翌日以降に続きから入る。
      - name: Apply to D1 (毎日・上限つき)
        if: steps.mode.outputs.apply == 'true'
        run: node scripts/seesaawiki_by_actress.js --apply-only --max-updates 6000 || echo "apply failed (non-fatal)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_FANZA_0_ID:        ${{ secrets.D1_FANZA_0_ID }}
          D1_FANZA_1_ID:        ${{ secrets.D1_FANZA_1_ID }}
          D1_MGS_ID:            ${{ secrets.D1_MGS_ID }}

      - name: Commit progress
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/seesaawiki_actress_map_v2.jsonl \
            data/seesaawiki_progress_v2.json \
            || true
          if ! git diff --staged --quiet; then
            git commit -m "seesaawiki: scraper progress [skip ci] [vercel skip]"
            git pull --rebase origin main || git rebase --abort || true
            git push || echo "Push failed (non-fatal, will retry next run)"
          fi
