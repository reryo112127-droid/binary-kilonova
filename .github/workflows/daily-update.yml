name: Daily Update (FANZA)

# 役割分担:
#   - FANZA(DMM API)の日次更新 → ここ(GitHub Actions)。IPブロックされないAPI。
#   - MGSスクレイプ → PC(daily_main.bat)。GitHub Actions IPはMGStageにブロックされるため。
#   - AVWIKI → avwiki-scraper.yml(GitHub Actions)。
#   - 静的キャッシュ生成・Cloudflareデプロイ → PC(daily_main.bat 10:30, MGS取得後に1回だけ)。
#     ここではcache生成・デプロイを行わない(Turso読み込みの二重消費を避けるため)。

on:
  schedule:
    - cron: '5 15 * * *'   # FANZA: 深夜 0:05 JST (= 15:05 UTC)
  workflow_dispatch:

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fanza-update:
    name: FANZA 日次更新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run FANZA daily update
        run: node scripts/fanza_daily_update.js
        env:
          DMM_API_ID:            ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID:      ${{ secrets.DMM_AFFILIATE_ID }}
          DMM_AFFILIATE_IDS:     ${{ secrets.DMM_AFFILIATE_IDS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_FANZA_0_ID:        ${{ secrets.D1_FANZA_0_ID }}
          D1_FANZA_1_ID:        ${{ secrets.D1_FANZA_1_ID }}
      # 予約作品のサンプル画像/動画は発売日前後に公開される。fanza_daily_update は「明日以降に発売」
      # の作品しか再取得しないため、発売日を跨いだ作品のサンプルが取り込まれずに残る。
      # 予約中〜発売後90日をローリングで再確認し、公開されたぶんを product_samples へ入れる。
      - name: Backfill pre-order sample images/videos
        run: node scripts/backfill_preorder_samples.js --limit 1500
        env:
          DMM_API_ID:            ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID:      ${{ secrets.DMM_AFFILIATE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_FANZA_0_ID:        ${{ secrets.D1_FANZA_0_ID }}
          D1_FANZA_1_ID:        ${{ secrets.D1_FANZA_1_ID }}

      - name: Build suggest cache (D1)
        run: node scripts/build_suggest_cache.js
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_FANZA_0_ID:        ${{ secrets.D1_FANZA_0_ID }}
          D1_FANZA_1_ID:        ${{ secrets.D1_FANZA_1_ID }}
          D1_MGS_ID:             ${{ secrets.D1_MGS_ID }}

      - name: Commit suggest cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/suggest_cache.json site/public/data/suggest_cache.json site/data/suggest_cache.json || true
          if ! git diff --staged --quiet; then
            git commit -m "cache: FANZA日次更新後のサジェストキャッシュ更新 [skip ci]"
            git pull --rebase origin main || git rebase --abort || true
            git push || echo "Push failed (non-fatal)"
          fi
