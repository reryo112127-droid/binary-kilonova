name: 週次サジェストのメーカー一覧更新

# 2026-10-22: このジョブはもう本番にデプロイしない（ビルド・デプロイとサイトマップ/LP一覧の生成を外した）。
# - 9/6 から毎週失敗していた（build:cf の build_lp_cache.mjs が better-sqlite3 とローカルDBを要る）。
# - 商品/LP/女優のシャード（site/data/lp・product・actress_display）はコミットされず PC にしか無いので、
#   CI からデプロイすると本番からそれらが消え、D1 の読取が枠を超える。
# - サイトマップ・女優一覧・メーカー一覧・ジャンル/シリーズ一覧は PC の daily_main.bat が作ってデプロイする
#   （[4a][4b] は週1回）。PC は git pull しないので、ここでコミットしても本番には届いていなかった。
# 残すのはサジェスト用のメーカー/レーベル一覧（data/suggest_cache.json）の取り直しだけ。
# daily-update.yml の build_suggest_cache.js がコミット済みのこの一覧を再利用する。

on:
  schedule:
    - cron: '0 18 * * 0'   # 日曜 03:00 JST (= 18:00 UTC 土曜)
  workflow_dispatch:

concurrency:
  group: weekly-sitemap-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-suggest-makers:
    name: サジェストのメーカー一覧更新
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # scripts/ は直下の package.json（dotenv など）。site だけ入れていたので 'dotenv' が無くて毎回落ちていた
      - name: Install dependencies
        run: npm ci

      # サジェストのメーカー/レーベル一覧を D1 から取り直す（DISTINCT は全表走査なので週1回だけ。
      # 日次の build_suggest_cache.js はコミット済み suggest_cache.json を再利用しD1を読まない）
      - name: Refresh suggest makers/labels (weekly full scan)
        run: node scripts/build_suggest_cache.js --refresh-makers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          D1_FANZA_0_ID:        ${{ secrets.D1_FANZA_0_ID }}
          D1_FANZA_1_ID:        ${{ secrets.D1_FANZA_1_ID }}
          D1_MGS_ID:             ${{ secrets.D1_MGS_ID }}

      - name: Commit updated suggest cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/suggest_cache.json || true
          if ! git diff --staged --quiet; then
            git commit -m "cache: 週次サジェストのメーカー一覧更新 [skip ci]"
            git pull --rebase origin main || git rebase --abort || true
            git push || echo "Push failed (non-fatal)"
          fi
